<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devoir de Cassie — Classes de mots · Grands nombres et multiplication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/pepitorino-dev/Devoirs@v1.1.2/devoir-engine.css">
</head>
<body class="de-body">
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/gh/pepitorino-dev/Devoirs@v1.1.2/devoir-engine.js"></script>

  <script>
    const d = Devoir.creer({
      cible: '#app',
      eleve: 'Cassie',
      type: 'devoir',
      matiere: "Français et mathématique",
      sujet: 'Classes de mots · Grands nombres et multiplication',
      niveau: '5e année',
      cycle: '3e cycle du primaire',
      difficulte: 'Moyen',
      objectif: "Reconnaître le nom, le déterminant et l'adjectif, accorder le groupe du nom, conjuguer les verbes fréquents au présent, comparer de grands nombres et multiplier à plusieurs chiffres.",
      total: 40,
      storageKey: 'devoir_cassie_mixte_motsmult_moyen',
      theme: 'default'
    });

    /* ============ PARTIE A — FRANÇAIS ============ */

    d.exercice(1, 'Je reconnais les classes de mots', 6)
      .consigne('Touche un mot, puis touche la classe à laquelle il appartient.')
      .rappel("<b>Rappel :</b> le <b>nom</b> désigne une réalité (<i>village, courage</i>). " +
              "Le <b>déterminant</b> se place devant le nom (<i>le, cette, quelques</i>). " +
              "L'<b>adjectif</b> décrit le nom (<i>brillante, amical</i>).")
      .glisserDeposerCategories({
        items: ['village', 'cette', 'brillante', 'quelques', 'courage', 'amical', 'valise', 'ces', 'précieux'],
        categories: ['Nom', 'Déterminant', 'Adjectif'],
        key: 'ex1_tri',
        consigne: 'Touche un mot, puis la catégorie où le placer.'
      });

    d.exercice(2, 'Nom commun ou nom propre ?', 3)
      .consigne('Touche chaque carte pour choisir : C = nom commun, P = nom propre.')
      .toggleGrille(
        [
          { label: 'Wendake',    key: 'ex2_a' },
          { label: 'un village', key: 'ex2_b' },
          { label: 'Sedna',      key: 'ex2_c' },
          { label: 'le hockey',  key: 'ex2_d' },
          { label: 'les Innus',  key: 'ex2_e' },
          { label: 'du courage', key: 'ex2_f' }
        ],
        ['C', 'P'],
        { colonnes: 2 }
      );

    d.exercice(3, "J'accorde l'adjectif avec le nom", 4)
      .consigne("Touche la bonne forme de l'adjectif. Attention au genre et au nombre !")
      .choixInline('a) Ma famille a fait un', 'ex3_a', ['long', 'longue', 'longs'], 'voyage en train.')
      .choixInline('b) Ce sont de', 'ex3_b', ['bref', 'brève', 'brèves'], 'retrouvailles amicales.')
      .choixInline('c) Cassie a reçu un cadeau', 'ex3_c', ['précieux', 'précieuse', 'précieuses'], 'de sa grand-mère.')
      .choixInline('d) Les parents de Léa sont très', 'ex3_d', ['gentil', 'gentille', 'gentils'], 'avec nous.');

    d.exercice(4, 'Du singulier au pluriel', 3)
      .consigne('Réécris tout le groupe du nom au pluriel. Pense au déterminant, au nom et à l\'adjectif.')
      .ligneAvecFleche('<span class="de-letter">a)</span> un long voyage <span class="de-arrow">→</span>', 'ex4_a')
      .ligneAvecFleche('<span class="de-letter">b)</span> cette invitée attentive <span class="de-arrow">→</span>', 'ex4_b')
      .ligneAvecFleche('<span class="de-letter">c)</span> le nouveau gardien <span class="de-arrow">→</span>', 'ex4_c');

    d.exercice(5, 'Les verbes fréquents au présent', 4)
      .consigne('Écris le verbe entre parenthèses au présent de l\'indicatif.')
      .phraseATrous("a) Chaque matin, je ___ à l'école à pied. (aller)", ['ex5_a'], { width: '110px' })
      .phraseATrous('b) Tu ___ tes devoirs avant le souper. (faire)', ['ex5_b'], { width: '110px' })
      .phraseATrous('c) Nous ___ partir tôt en fin de semaine. (vouloir)', ['ex5_c'], { width: '110px' })
      .phraseATrous('d) Vous ___ prêts pour la sortie de vendredi. (être)', ['ex5_d'], { width: '110px' });

    /* ============ PARTIE B — MATHÉMATIQUE ============ */

    d.exercice(6, 'Je compare de grands nombres', 4)
      .consigne('Écris le bon symbole entre les deux nombres : &lt; , &gt; ou = .')
      .rappel('<b>Rappel :</b> quand les deux nombres ont le même nombre de chiffres, ' +
              'on compare d\'abord les chiffres qui ont la plus grande valeur de position.')
      .phraseATrous('a) 165 900 ___ 161 495', ['ex6_a'], { width: '60px' })
      .phraseATrous('b) 407 060 ___ 407 600', ['ex6_b'], { width: '60px' })
      .phraseATrous('c) 89 999 ___ 90 001', ['ex6_c'], { width: '60px' })
      .phraseATrous('d) 250 000 ___ 225 000 + 25 000', ['ex6_d'], { width: '60px' });

    d.exercice(7, 'La droite numérique', 4)
      .consigne('Trouve les nombres cachés sous les flèches A et B, puis réponds aux questions.')
      .ligneNumerique({
        min: 12150, max: 20150, pas: 1000,
        marques: [
          { valeur: 14150, label: 'A', key: 'ex7_a' },
          { valeur: 18150, label: 'B', key: 'ex7_b' }
        ]
      })
      .texte('c) Quel est le pas de graduation de cette droite ?', 'ex7_c')
      .texte('d) Quel est l\'écart entre le nombre A et le nombre B ?', 'ex7_d');

    d.exercice(8, 'Je multiplie', 6)
      .consigne('Calcule chaque produit en colonne. Écris un chiffre par case.')
      .operationColonne({ label: 'a)', operande1: '316', operande2: '4',  operateur: '×', key: 'ex8_a' })
      .operationColonne({ label: 'b)', operande1: '128', operande2: '7',  operateur: '×', key: 'ex8_b' })
      .operationColonne({ label: 'c)', operande1: '52',  operande2: '24', operateur: '×', key: 'ex8_c' })
      .operationColonne({ label: 'd)', operande1: '236', operande2: '13', operateur: '×', key: 'ex8_d' });

    d.exercice(9, 'Le tournoi de hockey', 6)
      .histoire("Le club de hockey de l'école vend des billets pour son tournoi de fin de semaine. " +
                "L'école a vendu 145 billets d'adulte à 12 $ chacun et 236 billets d'enfant à 5 $ chacun.")
      .texte("a) Combien d'argent rapportent les billets d'adulte ?", 'ex9_a')
      .texte("b) Combien d'argent rapportent les billets d'enfant ?", 'ex9_b')
      .texte("c) Combien d'argent le tournoi rapporte-t-il en tout ?", 'ex9_c')
      .redaction("d) Avant de calculer, on peut arrondir les nombres pour faire une approximation. " +
                 "Explique l'approximation que tu ferais pour vérifier ta réponse en c).",
                 'ex9_d',
                 { placeholder: 'J\'arrondis…', hauteur: 110 });

    d.bonus('Écris un nombre plus grand que 452 300 mais plus petit que 452 400, puis écris-le en mots.',
            '+2 pts',
            ['bonus_nombre', 'bonus_mots']);

    d.signoff('Bravo Cassie ! Prends ton temps et relis-toi avant de terminer. 🌟');
    d.render();
  </script>
</body>
</html>
